services:
  - type: web
    name: coniccomputer-crm
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WEB_APP_URL
        sync: false
      - key: VITE_SECRET_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
